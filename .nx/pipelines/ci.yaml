# yaml-language-server: $schema=https://cloud.nx.app/nx-cloud/static/schemas/workflow.schema.json
on:
  pull-requests:
    event: PR
    branches: ['main']
  pushes:
    event: PUSH
    branches: ['main']

ultracache: .nx/pipelines/ultracache-config.yaml


env:
  NX_CLOUD_PACKING_WORK_CURVE_ADMISSION: 'true'
  NX_CLOUD_VERBOSE_LOGGING: 'true'
  NX_CLOUD_LOG_VM_CAPACITY: 'true'

jobs:
  main:
    runs-on: linux-medium-js
    workers:
      scheduling-constraints:
        - targets: ['e2e-ci--**/**']
          cannot-run-with:
            - targets: ['e2e-ci--**/**']
    steps:
      - name: Run all tasks
        run: npx nx run-many -t lint test build e2e-ci
      - name: Print main-job worker log
        run: find ~/.nx -path '*main-job-workers/*/worker.log' -exec cat {} +
