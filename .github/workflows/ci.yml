name: CI

# Nx Cloud CI now runs CI for this repository, so this workflow no longer runs on its own.
# To run it again on every change, restore the triggers below and remove `on: workflow_dispatch`.
# on:
#   push:
#     branches:
#       - main
#   pull_request:
on: workflow_dispatch

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx nx format:check
      - run: npx nx sync:check
      - run: npx nx validate
      - run: npx nx run-many -t build typecheck lint test
      - run: npx nx run-many -t e2e
